services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: shipsafe
      POSTGRES_DB: shipsafe
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shipsafe -d shipsafe"]
      interval: 2s
      timeout: 2s
      retries: 30

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://shipsafe@postgres:5432/shipsafe
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    command: sh -c "npm run -w apps/api migrate && npm run -w apps/api dev"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      VITE_API_URL: http://api:3000
    depends_on:
      - api
    ports:
      - "5173:5173"
